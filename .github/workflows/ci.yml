name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check water planning frontend
        working-directory: frontend
        run: npx eslint src/pages/Recommendations.jsx src/pages/Irrigation.jsx src/water.js src/api.js
      - name: Lint baseline (informational)
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  mysql-migrations:
    name: MySQL migration and model consistency
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: farm_ci
          MYSQL_USER: farm_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql+pymysql://farm_ci:ci-only-password@127.0.0.1:3306/farm_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install migration dependencies
        run: pip install sqlalchemy==2.0.44 pymysql==1.2.0 alembic==1.17.2 python-dotenv==1.2.1 cryptography
      - name: Apply migrations and check ORM consistency
        run: |
          python -m alembic upgrade head
          python -m alembic check
